[project]
name = "advanced-llm"
version = "1.0.0"
description = "生产级多环境多模型多格式 LLM 客户端工具包"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30.0"]
all = [
    "anthropic>=0.30.0",
    "tiktoken>=0.7.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["advanced_llm*"]

[tool.ruff]
line-length = 100
target-version = "py310"
